<style>
:root{
  /* Thème par défaut « Akane » : vermillon de la poste japonaise sur papier chaud. */
  --bg:#F6F2EC; --surface:#FFFFFF; --surface-2:#EFE9E1; --line:#E4DDD3;
  --ink:#1E1A17; --muted:#6B635B; --faint:#A1988E;
  --accent:#B8432F; --accent-ink:#FFFFFF; --accent-soft:#F6E2DC;
  --hanko:#C4342C; --ok:#17744F; --ok-soft:#DFF2E8; --warn:#9A5B06; --warn-soft:#FAEFD9;
  --kraft-soft:#F1E6D5; --kraft-line:#DCC7A6;
  --thumb-s:42%; --thumb-l:88%; --thumb-ink:34%;
  --shadow:0 1px 2px rgba(40,26,18,.05),0 6px 20px rgba(40,26,18,.07);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#12100E; --surface:#1B1816; --surface-2:#24201D; --line:#352F2A;
    --ink:#EDE7E1; --muted:#AA9F95; --faint:#766D64;
    --accent:#F08A74; --accent-ink:#1A0E0B; --accent-soft:#3A1E18;
    --hanko:#E45B52; --ok:#4FC392; --ok-soft:#13302A; --warn:#E3A850; --warn-soft:#33270F;
    --kraft-soft:#2A2319; --kraft-line:#4A3D2A;
    --thumb-s:28%; --thumb-l:24%; --thumb-ink:78%; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;padding:0 16px 110px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border:2px solid var(--hanko);color:var(--hanko);border-radius:50%;display:grid;place-items:center;font-weight:700;transform:rotate(-8deg);flex:none}
.brand b{display:block;font-size:17px}
.brand small{display:block;font-size:11.5px;color:var(--muted)}
h1{font-size:26px;margin:20px 0 4px;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0}
section{margin-top:24px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.eyebrow span{text-transform:none;letter-spacing:0;font-weight:500}
.stack{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.row{display:flex;gap:12px;align-items:flex-start}
.grow{flex:1;min-width:0}
.t{font-weight:700;line-height:1.3;word-break:break-word}
.jp{font-size:12.5px;color:var(--muted);margin-top:2px}
.meta{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-size:11.5px;padding:1px 8px 3px;border-radius:99px;background:var(--surface-2);font-weight:500;display:inline-flex;align-items:center}
.amt{font-family:var(--mono);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.thumb{width:52px;height:52px;border-radius:10px;flex:none;display:grid;place-items:center;overflow:hidden;background:hsl(var(--h) var(--thumb-s) var(--thumb-l));color:hsl(var(--h) 45% var(--thumb-ink));font-size:20px;font-weight:700}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.sm{width:44px;height:44px;font-size:17px}
.thumb.lg{width:100%;height:auto;aspect-ratio:1;font-size:30px}
.friends{display:flex;flex-wrap:wrap;gap:8px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px 9px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:2px}
.fchip.sug,.fchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fchip .n{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:4px}
.btn{border:0;border-radius:12px;padding:10px 16px 14px;font-weight:700;font-size:15px;line-height:1.2;cursor:pointer;background:var(--surface-2);text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:6px 12px 10px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px 4px;border-radius:99px;white-space:nowrap;display:inline-flex;align-items:center;line-height:1.2}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
a.lnk{color:inherit;text-decoration:none}
a.lnk:hover{text-decoration:underline;text-decoration-color:var(--faint)}
.ext{width:.8em;height:.8em;vertical-align:-.05em;fill:none;stroke:var(--faint);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile a.lnk,.mini a.lnk{display:block}
.irow{display:flex;gap:12px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.irow .t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.group .irow:first-of-type{border-top:0;padding-top:0}
.group h3{font-size:14px;margin:0;display:flex;justify-content:space-between;align-items:center}
.hanko{flex:none;width:40px;height:40px;border:2.5px solid var(--hanko);color:var(--hanko);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;line-height:1.05;writing-mode:vertical-rl;transform:rotate(-14deg);opacity:.9}
.label{background:var(--kraft-soft);border:1px solid var(--kraft-line);border-radius:14px;padding:16px}
.label .no{font-family:var(--mono);font-size:30px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.stat .v{font-family:var(--mono);font-size:16px;font-weight:500;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px}
.tile{position:relative;min-width:0}
.tile .tt{font-size:12px;line-height:1.3;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tp{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tile.dim .thumb{opacity:.45}
.tile .pill{position:absolute;top:6px;left:6px}
.bal{font-family:var(--mono);font-size:24px;font-weight:500}
.bal.clear{color:var(--ok)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=url],select,textarea{font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%;min-width:0}
textarea{min-height:150px;font-size:14px;line-height:1.5}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:78px 1fr;gap:10px;font-size:13.5px;padding:8px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed time{font-family:var(--mono);font-size:12px;color:var(--faint)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 14px;text-align:left;cursor:pointer}
.hrow:first-child{border-top:0}
.hbody{padding:4px 14px 14px}
.rowbtn{width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.tile .tilebtn .tp{margin-top:1px}
.facts{display:grid;gap:6px;margin:0 0 12px;padding:10px 12px;background:var(--surface-2);border-radius:10px}
.fact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:30px;font-size:13.5px}
.fact .k{flex:none;width:48px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.fact .mono{font-family:var(--mono)}
.fact .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chipbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 11px;font-family:inherit;font-size:12.5px;cursor:pointer}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.busy{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.busy .spin{width:14px;height:14px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
.mini .tt{font-size:11.5px;line-height:1.25;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .tp{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:3px;padding:9px 0 11px;font-size:11.5px;color:var(--muted);cursor:pointer;position:relative}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
/* Onglet actif : icône sur une pastille, trait de couleur au-dessus. */
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs button[aria-current="page"] svg{background:var(--accent-soft)}
.tabs svg{width:23px;height:23px;padding:3px 16px;box-sizing:content-box;border-radius:99px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:5px;left:calc(50% + 12px);background:var(--hanko);color:#fff;font-family:var(--mono);font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;font-size:13.5px;z-index:30}
.toast.err{background:var(--hanko);color:#fff}
.loading{display:flex;gap:10px;align-items:center;justify-content:center;color:var(--muted);padding:40px 0}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Choix d'un ami : grands boutons, deux par ligne */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 10px 14px;font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.pick button:hover{border-color:var(--accent)}
.pick button.sug{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ask{font-size:13px;font-weight:700;color:var(--ink)}
.linkbtn{border:0;background:none;padding:6px 0;color:var(--muted);font-size:13.5px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;justify-self:start}
.linkbtn:hover{color:var(--ink)}
.actions{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.iconbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.spin-on svg{animation:spin .8s linear infinite}
.topbtns{display:flex;gap:8px}
.empty{display:flex;gap:12px;align-items:center}
.empty .ok{width:36px;height:36px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-weight:700;flex:none}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:18px;display:grid;gap:4px}
.hero .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;opacity:.8}
.hero .v{font-family:var(--mono);font-size:34px;font-weight:500;line-height:1.1}
.hero .s{font-size:13.5px;opacity:.85}
.hero.clear{background:var(--ok-soft);color:var(--ok)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg .fchip{flex:none}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
/* Fiche d'un achat (✎) */
.sheet-wrap{position:fixed;inset:0;background:rgba(16,20,32,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;display:grid;gap:12px}
.sheet h2{margin:0;font-size:19px;padding-right:44px}
.sheet .x{position:absolute;top:14px;right:14px;border:0;background:var(--surface-2);border-radius:99px;width:36px;height:36px;cursor:pointer}
.check{display:flex;gap:10px;align-items:center;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.danger{color:var(--hanko)!important}
.editbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;flex:none;padding:0;color:var(--muted)}
.editbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile .editbtn{position:absolute;top:6px;right:6px;width:30px;height:30px;background:var(--surface)}
@media (min-width: 760px){.sheet-wrap{align-items:center}.sheet{border-radius:20px}}
/* Bouton pendant l'enregistrement */
.is-loading{opacity:.65;pointer-events:none;position:relative}
.is-loading::after{content:"";width:14px;height:14px;margin-left:8px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;display:inline-block}
/* Thèmes des pages amis (data-look sur <html>) */
[data-look="sylvanian"]{--accent:#4F7A4A;--accent-soft:#E3EDDC;--bg:#F5F2EA;--kraft-soft:#EFE7D4}
[data-look="pokemon"]{--accent:#CC2A36;--accent-soft:#FBE3E4;--bg:#F7F4F0;--ok:#1F7A4F}
[data-look="anime"]{--accent:#7B4BA6;--accent-soft:#EEE5F6;--bg:#F6F3F8}
[data-look="retro"]{--accent:#1F6F8B;--accent-soft:#DCEDF2;--bg:#F1F4F5}
@media (prefers-color-scheme: dark){
  [data-look="sylvanian"]{--accent:#9CC794;--accent-ink:#10140E;--accent-soft:#1F2B1D;--bg:#11140F}
  [data-look="pokemon"]{--accent:#FF6B75;--accent-ink:#1A0D0F;--accent-soft:#3A1A1E;--bg:#130F10}
  [data-look="anime"]{--accent:#C39BE6;--accent-ink:#150F1C;--accent-soft:#2A2035;--bg:#120F16}
  [data-look="retro"]{--accent:#7FC3DA;--accent-ink:#0C1518;--accent-soft:#16282E;--bg:#0E1315}
}

<body>
<div class="app">
  <header class="top"><div class="brand"><div class="mark" aria-hidden="true">宅</div><div><b>Ma box</b><small>Mise à jour automatiquement</small></div></div>
    <button class="iconbtn" id="refresh" type="button" aria-label="Actualiser" title="Actualiser"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button></header>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
// Utilitaires partagés par les deux pages.
const KEY = new URLSearchParams(location.search).get('f') || '';
const API_URL = 'https://script.google.com/macros/s/AKfycbyQ4XR8naWr8LNGiYwpPWRhXwuyHEPvpOMsdG2vFQWY5Af_XLXUk6ltjLF5MjXaPBA/exec';
let INITIAL = null;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => (n < 0 ? '−' : '') + Math.abs(Math.round(n || 0)).toLocaleString('fr-FR') + ' ¥';
const de = n => /^[aeiouyéè]/i.test(n) ? 'd’' + n : 'de ' + n;
function hue(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
// Sans photo : la vignette affiche le site (couleur et abréviation fixes), plus parlant que l'initiale du titre.
const SITES = { 'Mercari': ['M', 355], 'Yahoo Auctions': ['Y!', 25], 'Yahoo Flea Market': ['Y!', 40], 'Rakuma': ['R', 330],
  'Rakuten': ['R', 330], 'Amazon': ['a', 35], 'Sylvania': ['S', 145], 'Sylvanian': ['S', 145], 'Pokémon Center': ['P', 210], 'Pokemon Center': ['P', 210] };
function thumb(it, cls) {
  const site = SITES[it.platform];
  const g = site ? site[0] : esc((String(it.platform || it.title || '?').replace(/^[\s\-–—\[【(（]+/, '')[0] || '?'));
  const h = site ? site[1] : hue(it.platform || it.title || '');
  const img = it.photo ? `<img src="${esc(it.photo)}" alt="" loading="lazy" onerror="this.remove()">` : '';
  return `<div class="thumb ${cls || ''}" style="--h:${h}" aria-hidden="true">${img || g}</div>`;
}
function pill(status, friendView) {
  if (status === 'reçu') return `<span class="pill ok">Reçu</span>`;
  if (status === 'envoyé') return `<span class="pill ok">Envoyé</span>`;
  if (status === 'partagé') return `<span class="pill neutral">Partagé</span>`;
  if (status === 'en route') return `<span class="pill warn">En route</span>`;
  // Acheté mais pas encore envoyé par le vendeur : même libellé dans ton app et sur la page de l'ami.
  return `<span class="pill neutral">Pas expédié</span>`;
}
// Icône standard « ouvrir dans un nouvel onglet ».
const EXT = '<svg class="ext" viewBox="0 0 24 24" role="img" aria-label="ouvre le site"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
const ICON_RECEIPT = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>';
const ICON_CAMERA = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
/** Box envoyée, dépliée : suivi, puis port avec son reçu de la poste (la preuve du port) sur la même ligne. */
function boxFacts(b, receiptAttrs, extra) {
  return `<div class="facts">${b.tracking ? `<div class="fact"><span class="k">Suivi</span><span class="v mono">${esc(b.tracking)}</span></div>` : ''}
    <div class="fact"><span class="k">Port</span><span class="v">${b.port ? yen(b.port) : '—'}</span>
      <span class="acts">${b.receipt ? `<button type="button" class="chipbtn" ${receiptAttrs}>${ICON_RECEIPT}Voir le reçu</button>` : ''}${extra || ''}</span></div></div>`;
}
/**
 * Fiche d'un objet, par-dessus la page : photo, prix détaillé, lien vers l'annonce.
 * o.tip : pourboire au lieu de commission · o.tiered : commission à paliers (taux affiché)
 * o.admin : vue de ton app · o.actions : boutons en plus (ex. Modifier).
 */
function openItemSheet(i, o) {
  o = o || {};
  const old = document.getElementById('detail');
  if (old) old.remove();
  const rows = [
    ['Site', esc(i.platform || '—'), true], ['Acheté le', esc(i.date || '—'), true], ['Box', 'NO' + esc(i.box), true],
    ['Statut', pill(i.status, !o.admin), true],
    ['Prix d’achat', yen(i.price)],
    // Amis à paliers (taux selon le prix) : le taux appliqué à cet objet.
    i.commission ? [(o.tip ? 'Pourboire' : 'Commission') + (o.tiered && !o.tip && i.price ? ' (' + Math.round(i.commission / i.price * 100) + ' %)' : ''), yen(i.commission)] : null,
    i.shipJp ? ['Port au Japon', yen(i.shipJp)] : null,
    i.discount ? ['Remise', '− ' + yen(i.discount)] : null
  ].filter(Boolean);
  document.body.insertAdjacentHTML('beforeend', `<div class="sheet-wrap" id="detail"><div class="sheet" role="dialog" aria-modal="true" aria-label="Détails de l’objet">
    <button type="button" class="x" aria-label="Fermer">✕</button>
    <h2>${esc(i.title)}</h2>
    ${i.titleJp && i.titleJp !== i.title ? `<div class="jp" lang="ja">${esc(i.titleJp)}</div>` : ''}
    <div style="max-width:260px;width:100%;justify-self:center">${thumb(i, 'lg')}</div>
    <dl class="detail">${rows.map(([k, v, txt]) => `<dt>${k}</dt><dd class="${txt ? 'txt' : ''}">${v}</dd>`).join('')}
      <dt class="sum">Total</dt><dd class="sum">${yen(i.total)}</dd></dl>
    ${i.link ? `<a class="btn ${o.actions ? 'ghost' : 'primary'}" href="${esc(i.link)}" style="text-decoration:none${o.actions ? ';color:inherit' : ''}">Voir l’annonce sur ${esc(i.platform || 'le site')} ${EXT}</a>`
      : '<div class="note">Pas de lien vers l’annonce pour cet objet.</div>'}
    ${o.actions || ''}
  </div></div>`);
  const view = document.getElementById('detail');
  view.addEventListener('click', e => { if (e.target === view || e.target.closest('.x')) view.remove(); });
}
/** Entoure un bout de HTML d'un lien vers l'annonce, s'il y en a une. */
const linked = (it, html) => (it.link ? `<a class="lnk" href="${esc(it.link)}">${html}</a>` : html);
/** Titre cliquable, suivi de l'icône quand il y a une annonce. */
const titled = it => linked(it, esc(it.title || it.ref || it.link) + (it.link ? ' ' + EXT : ''));

/** Squelette affiché pendant le premier chargement des données. */
function skeleton(title) {
  const card = `<div class="skcard"><div style="display:flex;gap:12px"><div class="sk" style="width:52px;height:52px;flex:none"></div>
    <div style="flex:1;display:grid;gap:8px"><div class="sk" style="height:14px;width:80%"></div><div class="sk" style="height:12px;width:45%"></div></div></div>
    <div class="sk" style="height:40px"></div></div>`;
  return `<h1>${esc(title)}</h1><section class="stack">${card}${card}${card}</section>`;
}

const STATUS_ORDER = { 'acheté': 0, 'en route': 0, 'reçu': 1, 'partagé': 1, 'envoyé': 2 };
function sortItems(list) {
  return list.slice().sort((a, b) => ((STATUS_ORDER[a.status] ?? 1) - (STATUS_ORDER[b.status] ?? 1))
    || (a.hold === b.hold ? 0 : a.hold ? 1 : -1) || (b.ts - a.ts) || (b.row - a.row));
}

let toastTimer;
function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, err ? 6000 : 3800);
}
function copyText(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  if (!ok && navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Copié'), () => toast('Copie impossible', true));
  else toast(ok ? 'Copié' : 'Copie impossible', !ok);
}
// Lectures sans effet de bord : on peut les doubler ou les refaire sans risque.
const READ_ACTIONS = ['state', 'details', 'friend', 'boxItems', 'receiptImg', 'bilan', 'ynabCheck', 'ynabCategories'];

/** Une demande au serveur. Erreur « app » (refus, donnée invalide) : à ne pas refaire ; sinon erreur passagère de Google. */
async function askOnce(url, ms, ctrl) {
  const timer = setTimeout(() => ctrl.abort(), ms);
  let text = '', status = 0;
  try {
    const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    status = res.status;
    text = await res.text();
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'Le serveur ne répond pas, réessaie.' : 'Connexion impossible (' + e.message + ')');
  } finally {
    clearTimeout(timer);
  }
  let body = null;
  try { body = JSON.parse(text); } catch (e) {
    // Page d'erreur de Google au lieu des données : on garde le début pour savoir ce que c'était.
    throw new Error('Réponse inattendue de Google (HTTP ' + status + ') : '
      + text.replace(/<(style|script)[\s\S]*?<\/(style|script)>/gi, ' ').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 100));
  }
  if (!body.ok) { const err = new Error(body.error || 'Erreur du serveur'); err.app = true; throw err; }
  return body.data;
}

/**
 * Appel au serveur. Google met parfois 10 s ou plus à rendre une réponse que le script a produite en 1 s,
 * ou renvoie une page d'erreur ; d'une demande à l'autre, c'est aléatoire. Pour une lecture, si la réponse tarde
 * (6 s) ou échoue, une nouvelle demande part en parallèle (4 au plus) et la première réponse l'emporte.
 * Une action (paiement, modification…) n'est envoyée qu'une fois : elle ne doit pas être enregistrée deux fois.
 */
function server(action, payload) {
  if (READ_ACTIONS.indexOf(action) < 0) return sendAction(action, payload);
  const url = API_URL + '?k=' + encodeURIComponent(KEY) + '&a=' + encodeURIComponent(action)
    + (payload ? '&p=' + encodeURIComponent(JSON.stringify(payload)) : '') + '&t=' + Date.now();
  return new Promise((resolve, reject) => {
    const MAX = 4, ctrls = [];
    let done = false, launched = 0, failed = 0, last = null, timer = null;
    const finish = (fn, v) => {
      if (done) return;
      done = true; clearInterval(timer);
      ctrls.forEach(c => c.abort());
      fn(v);
    };
    const launch = () => {
      if (done || launched >= MAX) return;
      launched++;
      const ctrl = new AbortController();
      ctrls.push(ctrl);
      askOnce(url + '&r=' + launched, 30000, ctrl).then(v => finish(resolve, v), e => {
        if (done) return;
        if (e.app) { finish(reject, e); return; }
        last = e; failed++;
        if (failed >= MAX) finish(reject, last);
        else launch();
      });
    };
    launch();
    timer = setInterval(launch, 6000);
  });
}
/**
 * Action (paiement, attribution…) : numérotée (rid) puis renvoyée au plus 2 fois si Google perd la réponse.
 * Le serveur reconnaît le numéro d'une action déjà faite et renvoie son résultat sans la refaire.
 */
async function sendAction(action, payload) {
  const rid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const url = API_URL + '?k=' + encodeURIComponent(KEY) + '&a=' + encodeURIComponent(action)
    + '&p=' + encodeURIComponent(JSON.stringify(Object.assign({}, payload || {}, { rid: rid }))) + '&t=' + Date.now();
  let last = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt) await new Promise(r => setTimeout(r, 2000));
    try { return await askOnce(url + '&r=' + attempt, 30000, new AbortController()); }
    catch (e) { if (e.app) throw e; last = e; }
  }
  throw last;
}
/** Photo choisie → JPEG réduit (1600 px) en base64 : lisible, et léger à envoyer. */
async function shrinkPhoto(file) {
  const img = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85).split(',')[1];
}
/*
 * Reçus déjà vus, retenus par l'identifiant de leur fichier (il change quand on remplace le reçu) :
 * en mémoire, et dans le navigateur pour les 8 derniers (environ 300 Ko chacun).
 */
const receiptMem = {};
function receiptCached(id) {
  if (!id) return null;
  if (receiptMem[id]) return receiptMem[id];
  try { const v = localStorage.getItem('rcpt:' + id); if (v) return (receiptMem[id] = JSON.parse(v)); } catch (e) {}
  return null;
}
function receiptKeep(id, r) {
  receiptMem[id] = r;
  try {
    const keys = JSON.parse(localStorage.getItem('rcpt-keys') || '[]').filter(k => k !== id);
    keys.push(id);
    while (keys.length > 8) localStorage.removeItem('rcpt:' + keys.shift());
    localStorage.setItem('rcpt-keys', JSON.stringify(keys));
    localStorage.setItem('rcpt:' + id, JSON.stringify(r));
  } catch (e) { /* stockage plein ou indisponible : la mémoire suffit pour cette visite */ }
}
const receiptWait = {};
function loadReceipt(id, payload) {
  const hit = receiptCached(id);
  if (hit) return Promise.resolve(hit);
  if (id && receiptWait[id]) return receiptWait[id];
  // 6 petits morceaux demandés en même temps (chacun est refait seul s'il échoue), puis recollés.
  const PARTS = 6, asks = [];
  for (let i = 0; i < PARTS; i++) asks.push(server('receiptImg', Object.assign({}, payload, { part: i, parts: PARTS })));
  const p = Promise.all(asks).then(rs => {
    const r = { mime: rs[0].mime, data: rs.map(x => x.data).join('') };
    if (id) receiptKeep(id, r);
    return r;
  });
  if (id) receiptWait[id] = p.finally(() => { delete receiptWait[id]; });
  return p;
}
/** Chargement en arrière-plan (box dépliée) : le reçu est prêt quand on le touche. */
function prefetchReceipt(id, payload) {
  if (id && !receiptCached(id)) loadReceipt(id, payload).catch(() => {});
}

/** Reçu de la poste d'une box, affiché par-dessus la page (chargé à la demande, puis retenu). */
async function showReceipt(box, payload, id) {
  const old = document.getElementById('receiptView');
  if (old) old.remove();
  document.body.insertAdjacentHTML('beforeend', `<div class="sheet-wrap" id="receiptView"><div class="sheet" role="dialog" aria-modal="true" aria-label="Reçu de la poste">
    <button type="button" class="x" aria-label="Fermer">✕</button>
    <h2>Reçu de la poste · BOX NO${esc(box)}</h2><div id="receiptBody"><div class="loading"><span class="spin"></span>Chargement du reçu…</div></div></div></div>`);
  const view = document.getElementById('receiptView');
  view.addEventListener('click', e => { if (e.target === view || e.target.closest('.x')) view.remove(); });
  let html;
  try {
    const r = await loadReceipt(id, payload);
    html = `<img src="data:${esc(r.mime)};base64,${r.data}" alt="Reçu de la poste de la BOX NO${esc(box)}" style="width:100%;border-radius:10px;border:1px solid var(--line)">`;
  } catch (e) { html = `<div class="note">${esc(e.message)}</div>`; }
  const body = document.getElementById('receiptBody');
  if (body) body.innerHTML = html;
}
</script>

<script>
let D = null, open = null, allPays = false, shown = 10;

/** Encart « ta box est en route » (dernier statut Japan Post). */
function transitCard(t) {
  if (!t) return '';
  const icon = t.delivered ? '✓' : '📦';
  return `<section><div class="card" style="border-color:var(--accent);gap:8px">
    <div class="row" style="align-items:center"><div class="empty"><div class="ok" style="background:var(--accent-soft);color:var(--accent)">${icon}</div></div>
      <div class="grow"><div class="t">Suivi de ta BOX NO${esc(t.box)} ${t.delivered ? '· arrivée' : '· en route'}</div>
      <div class="note">Envoyée le ${esc(t.sent)}</div></div><button type="button" class="iconbtn" data-track="1" aria-label="Actualiser le suivi" title="Actualiser le suivi"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button></div>
    <div><b>${esc(t.status)}</b>${t.date ? ` <span class="note">· ${esc(t.date)}</span>` : ''}${t.office ? `<div class="note">${esc(t.office)}</div>` : ''}</div>
    <div class="note">Suivi : <b style="font-family:var(--mono);color:var(--ink)">${esc(t.tracking)}</b></div>
    <div class="actions"><a class="linkbtn" href="${esc(t.jpUrl)}">Japan Post ${EXT}</a><a class="linkbtn" href="${esc(t.frUrl)}">La Poste ${EXT}</a>${hasReceipt(t.box) ? `<button type="button" class="linkbtn" data-receipt="${esc(t.box)}">${ICON_RECEIPT} Reçu</button>` : ''}</div>
  </div></section>`;
}

const hasReceipt = box => (D.history || []).some(b => b.box === String(box) && b.receipt);
/** Identifiant du fichier du reçu d'une box (vide sans reçu). */
function receiptIdOf(box) {
  const b = (D.history || []).find(x => x.box === String(box));
  return b && typeof b.receipt === 'string' ? b.receipt : '';
}

/** Sous le prix d'achat : commission, port au Japon et remise, s'il y en a. */
function extras(i, tiny) {
  const parts = [];
  if (i.commission) parts.push('+ ' + yen(i.commission) + (D.tip ? ' de pourboire, merci !' : ' de commission'));
  if (i.shipJp) parts.push('+ ' + yen(i.shipJp) + ' de port');
  if (i.discount) parts.push('− ' + yen(i.discount) + ' de remise');
  return parts.map(p => `<div class="note" style="font-size:${tiny ? '11px' : '11.5px'}">${p}</div>`).join('');
}

function render() {
  const d = D;
  const due = Math.max(0, d.balance);
  let h = `<h1>Bonjour ${esc(d.name)}</h1>
    <section class="hero ${due ? '' : 'clear'}">
      <div class="k">${due ? 'Reste à payer' : 'Tout est réglé'}</div>
      <div class="v">${yen(due)}</div>
      <div class="s">${due ? 'Tout ce qui reste à régler, toutes box confondues.' : 'Merci !'}</div>
    </section>
    ${transitCard(d.transit)}
    <section style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0;font-size:22px">Ta BOX NO${esc(d.box)} <span class="pill neutral" style="vertical-align:3px">en cours</span></h2>
      <span class="count">${d.items.length} objet${d.items.length > 1 ? 's' : ''} · ${yen(d.boxTotal)}</span>
      ${d.rule && d.rule.text && !d.tip ? `<div class="note" style="flex-basis:100%">Commission : ${esc(d.rule.text)}</div>` : ''}</section>`;
  const row = i => `<button type="button" class="irow rowbtn" data-item="${i.row}" aria-label="Détails : ${esc(i.title)}">${thumb(i, 'sm')}
      <div class="grow"><div class="t" style="font-size:14px">${esc(i.title)}</div>
        <div class="meta">${pill(i.status, true)}<span>${esc(i.platform)} · ${esc(i.date)}</span></div></div>
      <div style="text-align:right"><div class="amt">${yen(i.price)}</div>${extras(i)}</div></button>`;
  const sorted = sortItems(d.items);
  const coming = sorted.filter(i => i.status === 'acheté' || i.status === 'en route');
  const here = sorted.filter(i => i.status === 'reçu' || i.status === 'partagé');
  if (!d.items.length) h += `<section><div class="card note">${d.transit ? 'Ta BOX NO' + esc(d.box) + ' vient de commencer : tes prochains achats apparaîtront ici.' : 'Ta box est vide pour l’instant.'}</div></section>`;
  if (coming.length) {
    h += `<section><div class="eyebrow">Pas encore arrivés <span class="count">${coming.length}</span></div><div class="card group">${coming.map(row).join('')}</div></section>`;
  }
  if (here.length) {
    h += `<section><div class="eyebrow">Arrivés chez moi <span class="count">${here.length}</span></div><div class="card group">${here.slice(0, shown).map(row).join('')}`;
    if (here.length > shown) h += `<button type="button" class="linkbtn" data-showmore="1">Afficher plus (${here.length - shown} restants)</button>`;
    h += `</div></section>`;
  }
  const pays = allPays ? d.payments : d.payments.slice(0, 4);
  h += `<section><div class="eyebrow">Tes derniers paiements</div><div class="card group">${d.payments.length
    ? pays.map(p => `<div class="irow"><div class="grow">${esc(p.date)} <span class="note">· ${esc(p.method)}</span></div><div class="amt">${yen(p.amount)}</div></div>`).join('')
      + (d.payments.length > pays.length ? `<button type="button" class="linkbtn" data-more="1">Voir les ${d.payments.length} derniers</button>` : '')
    : '<p class="note" style="margin:0">Aucun paiement enregistré.</p>'}</div></section>`;
  if (d.history.length) {
    h += `<section><div class="eyebrow">Tes box précédentes <span>touche une box pour voir son contenu</span></div><div class="card" style="padding:0;gap:0;overflow:hidden">`;
    d.history.forEach(b => {
      const isOpen = open === b.box;
      h += `<button type="button" class="hrow" data-box="${esc(b.box)}" aria-expanded="${isOpen}">
        <div><div class="amt">BOX NO${esc(b.box)}</div><div class="note">${b.date ? 'Envoyée le ' + esc(b.date) : esc(b.note || 'Envoyée')} · ${b.n} objet${b.n > 1 ? 's' : ''}${b.weight && b.weight !== '0 kg' ? ' · ' + esc(b.weight) : ''}</div></div>
        <div style="text-align:right"><div class="amt">${yen(b.total)}</div>${isOpen ? '' : `<div class="note">port ${b.port ? yen(b.port) : '—'}</div>`}</div></button>`;
      if (isOpen) {
        h += `<div class="hbody">${boxFacts(b, `data-receipt="${esc(b.box)}"`)}${boxTiles(b)}</div>`;
      }
    });
    h += `</div></section>`;
  }
  document.getElementById('view').innerHTML = h;
}

/** Contenu d'une box envoyée : chargé quand on la déplie, puis gardé. */
const boxItems = {}, boxErr = {}, boxWait = {};
function boxTiles(b) {
  const items = boxItems[b.box];
  if (items) return `<div class="mini">${sortItems(items).map(i =>
    `<button type="button" class="tilebtn" data-item="${i.row}" aria-label="Détails : ${esc(i.title)}">${thumb(i, 'lg')}<div class="tt">${esc(i.title)}</div></button>`).join('')}</div>`;
  if (boxErr[b.box]) return `<div class="note">Contenu indisponible, touche la box pour réessayer.</div>`;
  if (!boxWait[b.box]) {
    boxWait[b.box] = server('boxItems', { box: b.box }).then(its => { boxItems[b.box] = its; }, () => { boxErr[b.box] = true; })
      .then(() => { delete boxWait[b.box]; render(); });
  }
  return `<div class="mini">${Array.from({ length: Math.min(b.n || 3, 6) }, () => '<div class="sk" style="aspect-ratio:1"></div>').join('')}</div>`;
}

document.getElementById('refresh').addEventListener('click', async e => {
  const b = e.currentTarget;
  b.classList.add('spin-on');
  try { D = await server('friend'); render(); toast('À jour'); } catch (x) { toast(x.message, true); }
  b.classList.remove('spin-on');
});
document.addEventListener('click', async e => {
  const tb = e.target.closest('[data-track]');
  if (tb) {
    tb.disabled = true; tb.classList.add('spin-on');
    try {
      const t0 = JSON.stringify(D.transit || null), tr = await server('track');
      D.transit = tr;
      toast(JSON.stringify(tr || null) === t0 ? 'Pas de nouvelle étape' : 'Suivi à jour');
    } catch (x) { toast(x.message, true); }
    render();
    return;
  }
  const r = e.target.closest('[data-receipt]');
  if (r) { showReceipt(r.dataset.receipt, { box: r.dataset.receipt }, receiptIdOf(r.dataset.receipt)); return; }
  // Objet de la box en cours ou d'une box précédente : sa fiche détaillée.
  const t = e.target.closest('[data-item]');
  if (t) {
    const row = Number(t.dataset.item);
    const past = Object.keys(boxItems).reduce((all, k) => all.concat(boxItems[k]), []);
    const it = D.items.concat(past).find(x => x.row === row);
    if (it) openItemSheet(it, { tip: D.tip, tiered: !!(D.rule && D.rule.tiered) });
    return;
  }
  if (e.target.closest('[data-more]')) { allPays = true; render(); return; }
  if (e.target.closest('[data-showmore]')) { const y = window.scrollY; shown += 10; render(); window.scrollTo(0, y); return; }
  const b = e.target.closest('[data-box]');
  if (!b) return;
  open = open === b.dataset.box ? null : b.dataset.box;
  if (open) delete boxErr[open];
  render();
  if (open) prefetchReceipt(receiptIdOf(open), { box: open });
});

(async () => {
  if (!INITIAL) {
    document.getElementById('view').innerHTML = skeleton('Bonjour');
    try { INITIAL = await server('friend'); } catch (e) {
      document.getElementById('view').innerHTML = `<div class="card note">Chargement impossible : ${esc(e.message)}. Réessaie dans un instant.</div>`;
      return;
    }
  }
  D = INITIAL;
  if (D.look && D.look !== 'classique') document.documentElement.dataset.look = D.look;
  render();
})();
</script>
</body>
</html>
