<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Takkyubin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Takkyubin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1117" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<style>
  /* Enveloppe de l'app : aucune donnée ici, tout est chargé depuis Google Apps Script. */
  :root { --bg: #F2F3F6; --ink: #161D33; --muted: #5F6880; --red: #C4342C; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0E1117; --ink: #E6E9F0; --muted: #9BA3B5; --red: #E45B52; color-scheme: dark; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, "Hiragino Sans", system-ui, sans-serif; }
  #frame { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: 0; width: 100%; height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; background: var(--bg); opacity: 0; transition: opacity .2s; }
  #frame.ready { opacity: 1; }
  #splash { position: fixed; inset: 0; display: grid; place-items: center; }
  .seal { width: 76px; height: 76px; border-radius: 50%; background: var(--red); color: var(--bg); display: grid; place-items: center; font-size: 36px; font-weight: 800; transform: rotate(-8deg); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: rotate(-8deg) scale(.92); opacity: .75; } }
  @media (prefers-reduced-motion: reduce) { .seal { animation: none; } }
  .msg { max-width: 320px; padding: 0 24px; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .msg b { color: var(--ink); }
  form { display: grid; gap: 10px; width: min(340px, calc(100% - 48px)); }
  input { font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px; border: 1px solid #DDE1E8; background: #fff; color: #161D33; }
  button { font: inherit; font-weight: 700; font-size: 16px; padding: 12px; border: 0; border-radius: 12px; background: #23407E; color: #fff; }
  .err { color: var(--red); font-size: 14px; min-height: 1.2em; text-align: center; }
</style>
</head>
<body>
<div id="splash"><div class="seal" aria-label="Chargement">宅</div></div>
<script>
  // Adresse de l'app (Google Apps Script). Seule la clé, gardée sur cet appareil, donne accès aux données.
  const APP = 'https://script.google.com/macros/s/AKfycbyQ4XR8naWr8LNGiYwpPWRhXwuyHEPvpOMsdG2vFQWY5Af_XLXUk6ltjLF5MjXaPBA/exec';
  const q = new URLSearchParams(location.search);
  let key = null;
  const friend = q.get('f');             // lien d'un ami : jamais mémorisé
  if (!friend) {
    if (q.get('k')) { try { localStorage.setItem('tk-key', q.get('k')); } catch (e) {} }
    try { key = q.get('k') || localStorage.getItem('tk-key'); } catch (e) { key = q.get('k'); }
  }
  // La clé reste dans l'adresse : sur iPhone, l'icône d'écran d'accueil reprend l'adresse telle quelle
  // et n'a pas accès à la mémoire de Safari.

  const token = friend || key;

  // Manifeste construit à la volée : l'icône d'écran d'accueil s'ouvre avec la clé dans l'adresse,
  // sans dépendre de la mémoire du navigateur (qui peut être vidée).
  if (token) {
    const base = location.origin + location.pathname;
    const start = base + (friend ? '?f=' : '?k=') + encodeURIComponent(token);
    const manifest = {
      name: 'Takkyubin', short_name: 'Takkyubin', lang: 'fr', display: 'standalone', scope: base, start_url: start,
      background_color: '#F2F3F6', theme_color: '#F2F3F6',
      icons: [
        { src: base + 'icon-192.png', sizes: '192x192', type: 'image/png' },
        { src: base + 'icon-512.png', sizes: '512x512', type: 'image/png' },
        { src: base + 'icon-maskable-512.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ]
    };
    document.querySelector('link[rel=manifest]').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
    if (!location.search) history.replaceState(null, '', start);
  }
  if (!token) {
    // Première ouverture sans clé (ex. icône d'écran d'accueil sur iPhone) : on colle le lien une fois, il est mémorisé.
    const splash = document.getElementById('splash');
    splash.innerHTML = `<form id="setup">
        <p class="msg">Colle <b>ton lien personnel</b> Takkyubin (une seule fois).</p>
        <input id="link" type="url" placeholder="https://tv106.github.io/takkyubin/?k=…" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="submit">Ouvrir</button>
        <div class="err" id="err"></div>
      </form>`;
    document.getElementById('setup').addEventListener('submit', e => {
      e.preventDefault();
      const raw = document.getElementById('link').value.trim();
      const m = /[?&]k=([A-Za-z0-9]+)/.exec(raw) || /^([a-f0-9]{30,})$/i.exec(raw);
      if (!m) { document.getElementById('err').textContent = 'Ce n’est pas un lien Takkyubin valide.'; return; }
      try { localStorage.setItem('tk-key', m[1]); } catch (x) {}
      location.replace(location.pathname + '?k=' + m[1]);
    });
  } else if (/Instagram|FBAN|FBAV|FB_IAB|Line\/|MicroMessenger|; wv\)/i.test(navigator.userAgent)) {
    // Navigateurs intégrés (Instagram, Facebook, LINE…) : ils bloquent l'app dans un cadre ; on l'ouvre directement.
    location.replace(APP + '?k=' + encodeURIComponent(token));
  } else {
    // Filet de sécurité : si l'app ne s'affiche pas, proposer de l'ouvrir directement.
    setTimeout(() => {
      const sp = document.getElementById('splash');
      if (sp && !document.querySelector('#frame.ready')) {
        sp.insertAdjacentHTML('beforeend', '<p class="msg" style="position:absolute;bottom:18%">Ça ne s’affiche pas ? <a href="' + APP + '?k=' + encodeURIComponent(token) + '">Ouvrir directement</a></p>');
      }
    }, 9000);
    const f = document.createElement('iframe');
    f.id = 'frame';
    f.title = 'Takkyubin';
    f.allow = 'clipboard-write';
    f.src = APP + '?k=' + encodeURIComponent(token);
    f.onload = () => { f.classList.add('ready'); setTimeout(() => document.getElementById('splash').remove(), 250); };
    document.body.appendChild(f);
  }
</script>
</body>
</html>
